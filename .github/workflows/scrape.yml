name: 24/7 Media Scraper

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch: # Allows manual trigger

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper
        id: scraper
        run: python scraper.py

      - name: Upload Downloaded Media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-media-${{ github.run_id }}
          path: downloads/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit seen_albums.txt
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_albums.txt
          # Only commits if seen_albums.txt actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen albums [skip ci]" && git push)
